name: 🚀 Deploy - Contact Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux runs simultanes se marchent dessus
# (l'un supprime des dossiers pendant que l'autre les remplit). Les runs
# suivants attendent leur tour plutot que d'etre annules a mi-chemin.
concurrency:
  group: deploy-contactlists
  cancel-in-progress: false

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  COMMIT_HASH: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ─────────────────────────────────────────────────────────────
      # Build sur le runner GitHub (rapide, non contraint) plutot que
      # sur l'hebergement mutualise : c'est `npm ci`/`npm run build`
      # (charge CPU/IO soutenue) qui declenchait la coupure de session
      # SSH cote cPanel/CloudLinux (aucune erreur de script, juste un
      # signal TERM externe). Seuls les fichiers compiles sont ensuite
      # envoyes au serveur - voir les etapes scp ci-dessous.
      # ─────────────────────────────────────────────────────────────

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://contactlists.mfwa.org/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci --quiet
          npm run build --quiet

      - name: Build backend
        working-directory: backend
        run: |
          npm ci --quiet
          npm run build --quiet

      - name: Prepare deploy staging
        run: |
          set -e
          mkdir -p deploy_staging/backend deploy_staging/frontend

          cp -r backend/dist deploy_staging/backend/dist
          cp backend/package.json backend/package-lock.json deploy_staging/backend/
          if [ -d backend/sql ]; then
            cp -r backend/sql deploy_staging/backend/sql
          fi

          cp -r frontend/dist/. deploy_staging/frontend/

          echo "✅ Staging prepared:"
          find deploy_staging -maxdepth 2

      # UN SEUL transfert pour backend + frontend. Deux etapes scp visant le
      # meme dossier cible avec `rm: true` ne fonctionnent pas : la seconde
      # efface le dossier que la premiere vient de remplir (c'est ce qui a
      # fait echouer le run du 22/09 avec "Fichiers de build introuvables").
      - name: Upload build artifacts
        id: scp_artifacts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_staging"
          target: "/home/${{ secrets.SSH_USER }}/_deploy_staging"
          strip_components: 1
          overwrite: true
          rm: true

      # Verifications sans effet de bord, DANS UNE ETAPE SEPAREE de "deploy" :
      # si l'une echoue ici, `steps.deploy` n'est jamais execute, donc le
      # rollback ne se declenche pas et le serveur reste exactement en l'etat.
      # (Au run precedent, un echec de simple verification a declenche un
      # rollback inutile alors que rien n'avait encore ete modifie.)
      - name: Pre-flight checks
        id: preflight
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"
            STAGING_PATH="/home/${{ secrets.SSH_USER }}/_deploy_staging"
            DOMAIN="contactlists.mfwa.org"

            # Filet de securite : si strip_components n'a pas retire le dossier
            # racine de l'archive, tout se retrouve un cran trop profond.
            if [ ! -d "$STAGING_PATH/backend/dist" ] && [ -d "$STAGING_PATH/deploy_staging/backend/dist" ]; then
              echo "  ↳ dossier racine non retire par strip_components : correction"
              mv "$STAGING_PATH/deploy_staging"/* "$STAGING_PATH/"
              rmdir "$STAGING_PATH/deploy_staging"
            fi

            ERR=0
            [ -d "$STAGING_PATH/backend/dist" ] || { echo "❌ backend/dist manquant dans $STAGING_PATH"; ERR=1; }
            [ -f "$STAGING_PATH/backend/package.json" ] || { echo "❌ backend/package.json manquant"; ERR=1; }
            [ -f "$STAGING_PATH/frontend/index.html" ] || { echo "❌ frontend/index.html manquant"; ERR=1; }
            if [ $ERR -ne 0 ]; then
              echo "--- contenu reel de $STAGING_PATH ---"
              find "$STAGING_PATH" -maxdepth 3 2>/dev/null || echo "(dossier inexistant)"
              exit 1
            fi
            echo "✅ Build artifacts reçus (backend + frontend)"

            # Le .env de l'app (DB, JWT, Google, S3, Resend, PORT) n'est JAMAIS
            # touché par le déploiement — déposé une fois à la main, dans APP_PATH.
            if [ ! -f "$APP_PATH/.env" ]; then
              echo "❌ $APP_PATH/.env introuvable — à créer à la main avant le premier déploiement"
              echo "   (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET,"
              echo "    GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ALLOWED_GOOGLE_WORKSPACE_DOMAIN,"
              echo "    CLIENT_URL=https://$DOMAIN, PORT, S3_*, RESEND_API_KEY)"
              exit 1
            fi

            # Variables obligatoires : le backend refuse de démarrer si l'une est vide.
            # On échoue ici, avant que quoi que ce soit ne soit touché.
            MISSING=""
            for VAR in DB_USER DB_PASSWORD DB_NAME JWT_SECRET GOOGLE_CLIENT_ID; do
              VALUE=$(grep -E "^$VAR=" "$APP_PATH/.env" | head -1 | cut -d '=' -f2- | tr -d '[:space:]')
              [ -z "$VALUE" ] && MISSING="$MISSING $VAR"
            done
            if [ -n "$MISSING" ]; then
              echo "❌ Variables vides ou absentes dans $APP_PATH/.env :$MISSING"
              exit 1
            fi
            echo "✅ Variables d'environnement obligatoires présentes"

      - name: Deploy to cPanel
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 600s
          command_timeout: 600s
          envs: COMMIT_HASH
          script: |
            set -e
            echo "=== Starting deployment ==="

            # ─────────── Configuration ───────────
            APP_NAME="contact-platform-api"
            DOMAIN="contactlists.mfwa.org"

            # Le backend tourne HORS de public_html (pas exposé au web directement,
            # seul Apache/.htaccess le proxie) : .env, node_modules et les logs n'y
            # sont donc jamais accessibles par une URL.
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"
            # Racine du domaine telle que cPanel la declare (Domains > Document Root).
            # Ce n'est PAS public_html/$DOMAIN : le dossier reellement servi par
            # Apache pour contactlists.mfwa.org est public_html/contactlists.
            PROD_PATH="/home/${{ secrets.SSH_USER }}/public_html/contactlists"
            BACKUP_PATH="/home/${{ secrets.SSH_USER }}/backups/contactlists-$(date +%Y%m%d-%H%M%S)"

            # Depose par les etapes "Upload ... artifacts" (scp) juste avant
            # cette etape : plus de git clone/fetch ni de build sur ce serveur.
            STAGING_PATH="/home/${{ secrets.SSH_USER }}/_deploy_staging"

            echo "📦 Creating backup..."
            mkdir -p "$(dirname "$BACKUP_PATH")"
            mkdir -p "$BACKUP_PATH"
            cp -r "$PROD_PATH" "$BACKUP_PATH/public_html" 2>/dev/null || true
            # node_modules est exclu : sur cet hébergement mutualisé, le copier
            # (des milliers de petits fichiers) a fait tuer la session SSH sans
            # aucun message d'erreur (limite CPU/IO côté cPanel/CloudLinux) —
            # trois déploiements de suite sont morts pendant cette étape. Il
            # est régénéré par `npm install` (déploiement normal) ou par le
            # rollback ci-dessous, donc son absence ici ne coûte rien.
            mkdir -p "$BACKUP_PATH/app"
            if [ -d "$APP_PATH" ]; then
              find "$APP_PATH" -mindepth 1 -maxdepth 1 ! -name node_modules \
                -exec cp -r {} "$BACKUP_PATH/app/" \; 2>/dev/null || true
            fi
            echo "✅ Backup created (node_modules exclu)"

            # Presence des fichiers de build, du .env et des variables
            # obligatoires : deja verifie par l'etape "Pre-flight checks",
            # qui s'execute avant celle-ci et n'a aucun effet de bord.
            # On ne relit ici que le port d'ecoute.
            APP_PORT=$(grep -E '^PORT=' "$APP_PATH/.env" | cut -d '=' -f2 | tr -d '[:space:]')
            APP_PORT="${APP_PORT:-4000}"

            echo "🛑 Clearing old PM2 process..."
            pm2 delete "$APP_NAME" --silent || true
            sleep 1

            echo "📤 Deploying backend..."
            mkdir -p "$APP_PATH/logs"
            # node_modules n'est volontairement PAS supprime : `npm install`
            # ci-dessous ne pose alors que le delta, au lieu de tout
            # reinstaller a chaque deploiement. C'est plus rapide, et surtout
            # si la session SSH est coupee en cours de route, le backend garde
            # des dependances utilisables au lieu de se retrouver sans rien.
            rm -rf "$APP_PATH/dist" "$APP_PATH/sql"
            cp -r "$STAGING_PATH/backend/dist" "$APP_PATH/dist"
            cp "$STAGING_PATH/backend/package.json" "$APP_PATH/package.json"
            cp "$STAGING_PATH/backend/package-lock.json" "$APP_PATH/package-lock.json"
            cp -r "$STAGING_PATH/backend/sql" "$APP_PATH/sql" 2>/dev/null || true
            cd "$APP_PATH"
            npm install --omit=dev --quiet
            echo "✅ Backend deployed"

            echo "📤 Deploying frontend (static)..."
            mkdir -p "$PROD_PATH"
            # Ce docroot contient aussi des fichiers qui appartiennent a cPanel :
            # .well-known (renouvellement du certificat SSL), php.ini, .user.ini.
            # Les supprimer casserait le HTTPS : on ne retire que nos propres fichiers.
            find "$PROD_PATH" -mindepth 1 -maxdepth 1 \
              ! -name '.htaccess' ! -name '.well-known' ! -name 'php.ini' \
              ! -name '.user.ini' ! -name 'cgi-bin' ! -name '.env' \
              -exec rm -rf {} +
            cp -r "$STAGING_PATH/frontend"/* "$PROD_PATH/"
            echo "✅ Frontend deployed"

            echo "🧹 Cleaning staging..."
            rm -rf "$STAGING_PATH"

            echo "🔧 Writing .htaccess (statique + reverse-proxy API -> Node)..."
            # Le .htaccess de ce dossier contient deja des directives PHP generees
            # par cPanel : on ne l'ecrase pas, on remplace uniquement notre bloc.
            HT="$PROD_PATH/.htaccess"
            touch "$HT"
            sed -i '/# BEGIN contact-platform/,/# END contact-platform/d' "$HT"
            HT_TMP=$(mktemp)
            cat > "$HT_TMP" << HTACCESS_EOF
            # BEGIN contact-platform - genere par le deploiement, ne pas editer
            RewriteEngine On

            # API et health check -> processus Node local
            RewriteRule ^api/(.*)$ http://127.0.0.1:${APP_PORT}/api/\$1 [P,L]
            RewriteRule ^health$ http://127.0.0.1:${APP_PORT}/health [P,L]

            # SPA : tout le reste qui n'est pas un fichier existant -> index.html
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
            # END contact-platform
            HTACCESS_EOF
            cat "$HT" >> "$HT_TMP"
            mv "$HT_TMP" "$HT"
            chmod 644 "$HT"
            echo "✅ .htaccess written (proxy vers port $APP_PORT)"
            echo "  ⚠️  Si l'hébergement n'a pas mod_proxy activé, utiliser plutôt"
            echo "     'Setup Node.js App' (Passenger) dans cPanel à la place de PM2."

            echo "🚀 Starting PM2..."
            # DOTENV_CONFIG_PATH + --cwd : le .env est chargé par son chemin absolu.
            # Sans ça, dotenv le cherche dans le répertoire de travail du process
            # (que PM2 place sur dist/), où il n'existe pas.
            DOTENV_CONFIG_PATH="$APP_PATH/.env" pm2 start "$APP_PATH/dist/server.js" \
              --name "$APP_NAME" \
              --cwd "$APP_PATH" \
              --watch false \
              --max-memory-restart "500M" \
              --error "$APP_PATH/logs/error.log" \
              --output "$APP_PATH/logs/out.log" \
              --node-args="--require dotenv/config" \
              --update-env \
              --silent
            sleep 4
            pm2 save --silent
            echo "✅ PM2 started"

            echo "🔍 Validating..."
            # Le shell etait positionne dans APP_PATH : on en sort avant de
            # valider, sinon toute suppression de ce dossier rend le repertoire
            # courant invalide et pm2 echoue avec 'ENOENT: uv_cwd'.
            cd "$HOME"
            ERRORS=0
            [ -d "$APP_PATH/dist" ]     && echo "  ✅ backend dist"  || { echo "  ❌ backend dist missing"; ERRORS=$((ERRORS+1)); }
            [ -f "$PROD_PATH/index.html" ] && echo "  ✅ frontend index.html" || { echo "  ❌ frontend index.html missing"; ERRORS=$((ERRORS+1)); }

            PM2_STATUS=$(pm2 jlist | node -e "
            const fs = require('fs');
            const list = JSON.parse(fs.readFileSync(0, 'utf-8'));
            const app = list.find(p => p.name === '$APP_NAME');
            if (!app) { console.log('missing'); process.exit(0); }
            console.log(app.pm2_env.status);
            ")

            if [ "$PM2_STATUS" = "online" ]; then
              echo "  ✅ PM2 online"
            else
              echo "  ❌ PM2 not online (statut actuel: $PM2_STATUS)"
              pm2 logs "$APP_NAME" --lines 30 --nostream || true
              ERRORS=$((ERRORS+1))
            fi

            LOCAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$APP_PORT/health" || echo "000")
            if [ "$LOCAL_CODE" = "200" ]; then
              echo "  ✅ /health local (port $APP_PORT)"
            else
              echo "  ❌ /health local KO (HTTP $LOCAL_CODE) — port occupé ou variable d'env manquante ?"
              ERRORS=$((ERRORS+1))
            fi

            if [ $ERRORS -gt 0 ]; then
              echo "❌ Validation failed ($ERRORS errors)"
              exit 1
            fi
            echo "✅ All validations passed"
            echo "=== ✨ Deploy complete (commit: ${COMMIT_HASH:0:7}) ==="

      - name: Test health endpoint
        id: health_test
        run: |
          sleep 5
          for i in {1..5}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://contactlists.mfwa.org/health)
            if [ "$CODE" = "200" ]; then echo "✅ Health OK"; exit 0; fi
            echo "⏳ Attempt $i/5 (HTTP $CODE), retrying..."
            sleep 3
          done
          echo "❌ Health endpoint failed"; exit 1

      - name: Test protected API route
        id: api_test
        run: |
          # /api/search/facets exige une session (requireAuth) : un 401 sans
          # cookie prouve que l'API et le middleware d'auth répondent bien.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/api/search/facets")
          if [ "$CODE" = "401" ] || [ "$CODE" = "200" ]; then
            echo "✅ /api/search/facets répond (HTTP $CODE)"
          else
            echo "❌ /api/search/facets KO (HTTP $CODE)"; exit 1
          fi

      - name: Test frontend
        id: frontend_test
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/")
          [ "$CODE" = "200" ] && echo "✅ Frontend OK" || { echo "❌ Frontend KO (HTTP $CODE)"; exit 1; }

      - name: Test SPA fallback
        id: spa_test
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/some/deep/route")
          [ "$CODE" = "200" ] && echo "✅ SPA fallback OK" || { echo "❌ SPA fallback KO (HTTP $CODE)"; exit 1; }

      - name: Success notification
        if: success()
        run: |
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "App: https://contactlists.mfwa.org"
          echo "Commit: ${{ github.sha }}"

      - name: Failure - Diagnostic (aucune restauration automatique)
        # Le rollback automatique a ete RETIRE. Sur cet hebergement mutualise,
        # il a ete interrompu deux fois en plein `rm -rf` + `cp -r`, laissant
        # le backend entierement supprime et PM2 vide : deux pannes de
        # production, et pas une seule restauration menee a bien. Cette etape
        # ne fait plus que decrire l'etat du serveur. Si une restauration est
        # necessaire, elle se fait a la main, depuis les sauvegardes listees
        # ci-dessous, en sachant ce qu'on restaure.
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"
            PROD_PATH="/home/${{ secrets.SSH_USER }}/public_html/contactlists"

            echo "=== Etat du serveur apres echec ==="
            echo "--- backend ($APP_PATH) ---"
            ls -la "$APP_PATH" 2>/dev/null || echo "  dossier ABSENT"
            [ -f "$APP_PATH/dist/server.js" ] && echo "  dist/server.js : present" || echo "  dist/server.js : ABSENT"
            [ -d "$APP_PATH/node_modules" ] && echo "  node_modules   : present" || echo "  node_modules   : ABSENT"
            [ -f "$APP_PATH/.env" ]          && echo "  .env           : present" || echo "  .env           : ABSENT"

            echo "--- frontend ($PROD_PATH) ---"
            [ -f "$PROD_PATH/index.html" ] && echo "  index.html : present" || echo "  index.html : ABSENT"

            echo "--- pm2 ---"
            pm2 status || true

            echo "--- sauvegardes disponibles (5 plus recentes) ---"
            for B in $(ls -td /home/${{ secrets.SSH_USER }}/backups/contactlists-* 2>/dev/null | head -5); do
              echo "  $B"
              echo "     app/dist=$([ -d "$B/app/dist" ] && echo oui || echo non)" \
                   "app/.env=$([ -f "$B/app/.env" ] && echo oui || echo non)" \
                   "app/node_modules=$([ -d "$B/app/node_modules" ] && echo oui || echo non)" \
                   "front=$([ -f "$B/public_html/index.html" ] && echo oui || echo non)"
            done

      - name: Ensure API is running
        # Filet de securite, execute quoi qu'il arrive : on ne laisse jamais le
        # site sans backend. Ne supprime rien et ne restaure rien — relance
        # seulement le processus s'il n'est pas en ligne.
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_NAME="contact-platform-api"
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"

            STATUS=$(pm2 jlist 2>/dev/null | node -e "
            const fs = require('fs');
            let list = [];
            try { list = JSON.parse(fs.readFileSync(0, 'utf-8')); } catch (e) {}
            const app = list.find(p => p.name === '$APP_NAME');
            console.log(app ? app.pm2_env.status : 'missing');
            " 2>/dev/null || echo "missing")
            echo "PM2 : $STATUS"

            if [ "$STATUS" = "online" ]; then
              echo "✅ API en ligne"
            elif [ -f "$APP_PATH/dist/server.js" ]; then
              echo "⚠️  API arretee — tentative de relance"
              mkdir -p "$APP_PATH/logs"
              pm2 delete "$APP_NAME" --silent || true
              DOTENV_CONFIG_PATH="$APP_PATH/.env" pm2 start "$APP_PATH/dist/server.js" \
                --name "$APP_NAME" \
                --cwd "$APP_PATH" \
                --error "$APP_PATH/logs/error.log" \
                --output "$APP_PATH/logs/out.log" \
                --node-args="--require dotenv/config" \
                --update-env \
                --silent
              sleep 4
              pm2 save --silent
              pm2 status
            else
              echo "❌ $APP_PATH/dist/server.js absent : relance impossible."
              echo "   Restauration manuelle necessaire depuis /home/${{ secrets.SSH_USER }}/backups/"
            fi

      - name: Prune old backups
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/backups || exit 0
            ls -td contactlists-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "🧹 Backups conservés : $(ls -d contactlists-* 2>/dev/null | wc -l)"

      - name: Slack notification
        if: always() && vars.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ Deploy successful' || '❌ Deploy failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ job.status == 'success' && '✅ Contact Platform' || '❌ Deploy Failed' }}*\n`${{ github.ref_name }}` → `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View App" }, "url": "https://contactlists.mfwa.org" },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Logs" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
