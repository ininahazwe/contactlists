name: 🚀 Deploy - Contact Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux runs simultanes se marchent dessus
# (l'un supprime des dossiers pendant que l'autre les remplit). Les runs
# suivants attendent leur tour plutot que d'etre annules a mi-chemin.
concurrency:
  group: deploy-contactlists
  cancel-in-progress: false

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to cPanel
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 600s
          command_timeout: 600s
          envs: VITE_GOOGLE_CLIENT_ID
          script: |
            set -e
            echo "=== Starting deployment ==="

            # ─────────── Configuration ───────────
            APP_NAME="contact-platform-api"
            DOMAIN="contactlists.mfwa.org"
            GIT_URL="https://github.com/ininahazwe/contactlists.git"

            REPO_PATH="/home/${{ secrets.SSH_USER }}/repositories/contactlists"
            # Le backend tourne HORS de public_html (pas exposé au web directement,
            # seul Apache/.htaccess le proxie) : .env, node_modules et les logs n'y
            # sont donc jamais accessibles par une URL.
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"
            # Racine du domaine telle que cPanel la declare (Domains > Document Root).
            # Ce n'est PAS public_html/$DOMAIN : le dossier reellement servi par
            # Apache pour contactlists.mfwa.org est public_html/contactlists.
            PROD_PATH="/home/${{ secrets.SSH_USER }}/public_html/contactlists"
            BACKUP_PATH="/home/${{ secrets.SSH_USER }}/backups/contactlists-$(date +%Y%m%d-%H%M%S)"

            BACKEND_DIR="$REPO_PATH/backend"
            FRONTEND_DIR="$REPO_PATH/frontend"

            echo "📦 Creating backup..."
            mkdir -p "$(dirname "$BACKUP_PATH")"
            mkdir -p "$BACKUP_PATH"
            cp -r "$PROD_PATH" "$BACKUP_PATH/public_html" 2>/dev/null || true
            cp -r "$APP_PATH" "$BACKUP_PATH/app" 2>/dev/null || true
            echo "✅ Backup created"

            echo "📥 Fetching code..."
            if [ ! -d "$REPO_PATH/.git" ]; then
              echo "  ↳ premier déploiement : clonage du dépôt"
              mkdir -p "$(dirname "$REPO_PATH")"
              git clone --quiet "$GIT_URL" "$REPO_PATH"
            fi
            cd "$REPO_PATH"
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            COMMIT_HASH=$(git rev-parse --short HEAD)
            echo "✅ Git pulled (commit: $COMMIT_HASH)"

            # Le .env de l'app (DB, JWT, Google, S3, Resend, PORT) n'est JAMAIS
            # touché ici — déposé une fois à la main sur le serveur, dans APP_PATH.
            if [ ! -f "$APP_PATH/.env" ]; then
              echo "❌ $APP_PATH/.env introuvable — à créer à la main avant le premier déploiement"
              echo "   (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET,"
              echo "    GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ALLOWED_GOOGLE_WORKSPACE_DOMAIN,"
              echo "    CLIENT_URL=https://$DOMAIN, PORT, S3_*, RESEND_API_KEY)"
              exit 1
            fi
            APP_PORT=$(grep -E '^PORT=' "$APP_PATH/.env" | cut -d '=' -f2 | tr -d '[:space:]')
            APP_PORT="${APP_PORT:-4000}"

            # Variables obligatoires : le backend refuse de démarrer si l'une est vide.
            # On échoue ici, avant de toucher quoi que ce soit, plutôt qu'après le build.
            MISSING=""
            for VAR in DB_USER DB_PASSWORD DB_NAME JWT_SECRET GOOGLE_CLIENT_ID; do
              VALUE=$(grep -E "^$VAR=" "$APP_PATH/.env" | head -1 | cut -d '=' -f2- | tr -d '[:space:]')
              [ -z "$VALUE" ] && MISSING="$MISSING $VAR"
            done
            if [ -n "$MISSING" ]; then
              echo "❌ Variables vides ou absentes dans $APP_PATH/.env :$MISSING"
              exit 1
            fi
            echo "✅ Variables d'environnement obligatoires présentes"

            echo "🎨 Building frontend..."
            cd "$FRONTEND_DIR"
            npm ci --quiet
            VITE_API_URL="https://$DOMAIN/api" \
            VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            npm run build --quiet
            echo "✅ Frontend built"

            echo "🔧 Building backend..."
            cd "$BACKEND_DIR"
            npm ci --quiet
            npm run build --quiet
            echo "✅ Backend compiled"

            echo "🛑 Clearing old PM2 process..."
            pm2 delete "$APP_NAME" --silent || true
            sleep 1

            echo "📤 Deploying backend..."
            mkdir -p "$APP_PATH/logs"
            rm -rf "$APP_PATH/dist" "$APP_PATH/node_modules" "$APP_PATH/sql"
            cp -r "$BACKEND_DIR/dist" "$APP_PATH/dist"
            cp "$BACKEND_DIR/package.json" "$APP_PATH/package.json"
            cp "$BACKEND_DIR/package-lock.json" "$APP_PATH/package-lock.json"
            cp -r "$BACKEND_DIR/sql" "$APP_PATH/sql" 2>/dev/null || true
            cd "$APP_PATH"
            npm install --omit=dev --quiet
            echo "✅ Backend deployed"

            echo "📤 Deploying frontend (static)..."
            mkdir -p "$PROD_PATH"
            # Ce docroot contient aussi des fichiers qui appartiennent a cPanel :
            # .well-known (renouvellement du certificat SSL), php.ini, .user.ini.
            # Les supprimer casserait le HTTPS : on ne retire que nos propres fichiers.
            find "$PROD_PATH" -mindepth 1 -maxdepth 1 \
              ! -name '.htaccess' ! -name '.well-known' ! -name 'php.ini' \
              ! -name '.user.ini' ! -name 'cgi-bin' ! -name '.env' \
              -exec rm -rf {} +
            cp -r "$FRONTEND_DIR/dist"/* "$PROD_PATH/"
            echo "✅ Frontend deployed"

            echo "🔧 Writing .htaccess (statique + reverse-proxy API -> Node)..."
            # Le .htaccess de ce dossier contient deja des directives PHP generees
            # par cPanel : on ne l'ecrase pas, on remplace uniquement notre bloc.
            HT="$PROD_PATH/.htaccess"
            touch "$HT"
            sed -i '/# BEGIN contact-platform/,/# END contact-platform/d' "$HT"
            HT_TMP=$(mktemp)
            cat > "$HT_TMP" << HTACCESS_EOF
            # BEGIN contact-platform - genere par le deploiement, ne pas editer
            RewriteEngine On

            # API et health check -> processus Node local
            RewriteRule ^api/(.*)$ http://127.0.0.1:${APP_PORT}/api/\$1 [P,L]
            RewriteRule ^health$ http://127.0.0.1:${APP_PORT}/health [P,L]

            # SPA : tout le reste qui n'est pas un fichier existant -> index.html
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
            # END contact-platform
            HTACCESS_EOF
            cat "$HT" >> "$HT_TMP"
            mv "$HT_TMP" "$HT"
            chmod 644 "$HT"
            echo "✅ .htaccess written (proxy vers port $APP_PORT)"
            echo "  ⚠️  Si l'hébergement n'a pas mod_proxy activé, utiliser plutôt"
            echo "     'Setup Node.js App' (Passenger) dans cPanel à la place de PM2."

            echo "🚀 Starting PM2..."
            # DOTENV_CONFIG_PATH + --cwd : le .env est chargé par son chemin absolu.
            # Sans ça, dotenv le cherche dans le répertoire de travail du process
            # (que PM2 place sur dist/), où il n'existe pas.
            DOTENV_CONFIG_PATH="$APP_PATH/.env" pm2 start "$APP_PATH/dist/server.js" \
              --name "$APP_NAME" \
              --cwd "$APP_PATH" \
              --watch false \
              --max-memory-restart "500M" \
              --error "$APP_PATH/logs/error.log" \
              --output "$APP_PATH/logs/out.log" \
              --node-args="--require dotenv/config" \
              --update-env \
              --silent
            sleep 4
            pm2 save --silent
            echo "✅ PM2 started"

            echo "🔍 Validating..."
            # Le shell etait positionne dans APP_PATH : on en sort avant de
            # valider, sinon toute suppression de ce dossier rend le repertoire
            # courant invalide et pm2 echoue avec 'ENOENT: uv_cwd'.
            cd "$HOME"
            ERRORS=0
            [ -d "$APP_PATH/dist" ]     && echo "  ✅ backend dist"  || { echo "  ❌ backend dist missing"; ERRORS=$((ERRORS+1)); }
            [ -f "$PROD_PATH/index.html" ] && echo "  ✅ frontend index.html" || { echo "  ❌ frontend index.html missing"; ERRORS=$((ERRORS+1)); }

            PM2_STATUS=$(pm2 jlist | node -e "
            const fs = require('fs');
            const list = JSON.parse(fs.readFileSync(0, 'utf-8'));
            const app = list.find(p => p.name === '$APP_NAME');
            if (!app) { console.log('missing'); process.exit(0); }
            console.log(app.pm2_env.status);
            ")

            if [ "$PM2_STATUS" = "online" ]; then
              echo "  ✅ PM2 online"
            else
              echo "  ❌ PM2 not online (statut actuel: $PM2_STATUS)"
              pm2 logs "$APP_NAME" --lines 30 --nostream || true
              ERRORS=$((ERRORS+1))
            fi

            LOCAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$APP_PORT/health" || echo "000")
            if [ "$LOCAL_CODE" = "200" ]; then
              echo "  ✅ /health local (port $APP_PORT)"
            else
              echo "  ❌ /health local KO (HTTP $LOCAL_CODE) — port occupé ou variable d'env manquante ?"
              ERRORS=$((ERRORS+1))
            fi

            if [ $ERRORS -gt 0 ]; then
              echo "❌ Validation failed ($ERRORS errors)"
              exit 1
            fi
            echo "✅ All validations passed"
            echo "=== ✨ Deploy complete (commit: $COMMIT_HASH) ==="

      - name: Test health endpoint
        id: health_test
        run: |
          sleep 5
          for i in {1..5}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://contactlists.mfwa.org/health)
            if [ "$CODE" = "200" ]; then echo "✅ Health OK"; exit 0; fi
            echo "⏳ Attempt $i/5 (HTTP $CODE), retrying..."
            sleep 3
          done
          echo "❌ Health endpoint failed"; exit 1

      - name: Test protected API route
        id: api_test
        run: |
          # /api/search/facets exige une session (requireAuth) : un 401 sans
          # cookie prouve que l'API et le middleware d'auth répondent bien.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/api/search/facets")
          if [ "$CODE" = "401" ] || [ "$CODE" = "200" ]; then
            echo "✅ /api/search/facets répond (HTTP $CODE)"
          else
            echo "❌ /api/search/facets KO (HTTP $CODE)"; exit 1
          fi

      - name: Test frontend
        id: frontend_test
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/")
          [ "$CODE" = "200" ] && echo "✅ Frontend OK" || { echo "❌ Frontend KO (HTTP $CODE)"; exit 1; }

      - name: Test SPA fallback
        id: spa_test
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://contactlists.mfwa.org/some/deep/route")
          [ "$CODE" = "200" ] && echo "✅ SPA fallback OK" || { echo "❌ SPA fallback KO (HTTP $CODE)"; exit 1; }

      - name: Success notification
        if: success()
        run: |
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "App: https://contactlists.mfwa.org"
          echo "Commit: ${{ github.sha }}"

      - name: Failure - Rollback
        # UNIQUEMENT si le deploiement lui-meme a echoue. Un test public en
        # echec (DNS, proxy, domaine mal dirige) ne dit rien sur les fichiers
        # deposes : restaurer dans ce cas detruit un deploiement reussi.
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_NAME="contact-platform-api"
            APP_PATH="/home/${{ secrets.SSH_USER }}/apps/contact-platform-backend"
            PROD_PATH="/home/${{ secrets.SSH_USER }}/public_html/contactlists"
            LATEST_BACKUP=$(ls -td /home/${{ secrets.SSH_USER }}/backups/contactlists-* 2>/dev/null | head -1)
            # On ne restaure QUE si le backup contient un deploiement precedent
            # COMPLET (backend compile ET frontend construit). Un backup partiel
            # vient d'un etat deja casse : le restaurer aggrave la situation.
            if [ -d "$LATEST_BACKUP/app/dist" ] && [ -f "$LATEST_BACKUP/public_html/index.html" ]; then
              echo "🔄 Rolling back to $LATEST_BACKUP"
              pm2 stop "$APP_NAME" --silent || true
              rm -rf "$APP_PATH"
              cp -r "$LATEST_BACKUP/app" "$APP_PATH" 2>/dev/null || true
              find "$PROD_PATH" -mindepth 1 -maxdepth 1 \
                ! -name '.htaccess' ! -name '.well-known' ! -name 'php.ini' \
                ! -name '.user.ini' ! -name 'cgi-bin' ! -name '.env' \
                -exec rm -rf {} + 2>/dev/null || true
              cp -r "$LATEST_BACKUP/public_html/"* "$PROD_PATH/" 2>/dev/null || true
              cd "$APP_PATH"
              pm2 delete "$APP_NAME" --silent || true
              pm2 start dist/server.js --name "$APP_NAME" --node-args="--require dotenv/config" --silent
              sleep 2
              pm2 save --silent
              echo "✅ Rollback complete"
            else
              echo "⚠️ Pas de déploiement précédent à restaurer — état actuel préservé tel quel"
              echo "   (les fichiers déposés par ce run restent en place pour diagnostic)"
            fi

      - name: Prune old backups
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/backups || exit 0
            ls -td contactlists-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "🧹 Backups conservés : $(ls -d contactlists-* 2>/dev/null | wc -l)"

      - name: Slack notification
        if: always() && vars.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ Deploy successful' || '❌ Deploy failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ job.status == 'success' && '✅ Contact Platform' || '❌ Deploy Failed' }}*\n`${{ github.ref_name }}` → `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View App" }, "url": "https://contactlists.mfwa.org" },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Logs" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
